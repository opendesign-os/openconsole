<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>画布 · @openconsole/interaction</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./canvas.ts"></script>
  </head>
  <body>
    <header class="controls">
      <span
        >拖空白处或卡片正文平移，滚轮或双指缩放；卡片只能从标题栏拖，“固定”徽标除外</span
      >
      <output id="hud" class="hud"></output>
      <button id="reset" type="button">复位</button>
      <nav>
        <a href="./index.html">画板</a> · <a href="./list.html">列表</a>
      </nav>
    </header>
    <main class="page">
      <div id="viewport" class="viewport">
        <div id="world" class="world">
          <div class="card note">
            <b class="title">卡片 A<i class="pin">固定</i></b>
            <p class="body">正文</p>
          </div>
          <div class="card note">
            <b class="title">卡片 B<i class="pin">固定</i></b>
            <p class="body">正文</p>
          </div>
          <div class="card note">
            <b class="title">卡片 C<i class="pin">固定</i></b>
            <p class="body">正文</p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
