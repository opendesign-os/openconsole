<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>列表 · @openconsole/interaction</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./list.ts"></script>
  </head>
  <body>
    <header class="controls">
      <label>
        缩放
        <input
          id="zoom"
          type="range"
          min="0.5"
          max="1.5"
          step="0.1"
          value="1"
        /><output></output>
      </label>
      <output id="log" class="hud"></output>
      <nav>
        <a href="./index.html">画板</a> · <a href="./canvas.html">画布</a>
      </nav>
    </header>
    <main class="page">
      <div class="lists">
        <ul id="list" class="list">
          <li class="row">一</li>
          <li class="row">二</li>
          <li class="row">三</li>
          <li class="row">四</li>
          <li class="row">五</li>
        </ul>
        <div id="trash" class="trash">拖到这里删除</div>
      </div>
    </main>
  </body>
</html>
